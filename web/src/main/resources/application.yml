server:
  port: 8080

spring:
  application:
    name: web
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:facturx}
    username: ${DB_USER:facturx}
    password: ${DB_PASSWORD:facturx}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  subscribe:
    ip-limit-per-hour: ${SUBSCRIBE_IP_LIMIT_PER_HOUR:5}
    global-limit-per-hour: ${SUBSCRIBE_GLOBAL_LIMIT_PER_HOUR:20}
  resend:
    api-base: ${RESEND_API_BASE:https://api.resend.com}
    # 空则报告邮件端点返回「暂不可用」，不会出网
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:Factur-X API <bonjour@factur-x-api.com>}
