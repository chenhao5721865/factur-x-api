server:
  port: 8080

spring:
  application:
    name: web
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:facturx}
    username: ${DB_USER:facturx}
    password: ${DB_PASSWORD:facturx}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  lemonsqueezy:
    # LS Test mode checkout URL（产品 "Factur-X API Pro"），空则 Souscrire 按钮隐藏
    checkout-url: ${LS_CHECKOUT_URL:}
