server:
  port: 8081

spring:
  application:
    name: api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:facturx}
    username: ${DB_USER:facturx}
    password: ${DB_PASSWORD:facturx}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 独立历史表：与 web 模块共用同一数据库，避免 flyway_schema_history 校验冲突
    table: flyway_api_history
    # 生产库 schema 已有 web 的表，Flyway 要求在非空 schema 建新历史表时显式 baseline
    baseline-on-migrate: true
    # baseline 默认 version=1 会把 V1 迁移标记为已应用导致不执行，必须降到 0
    baseline-version: 0

app:
  quota:
    free-monthly: ${QUOTA_FREE_MONTHLY:5}
    pro-monthly: ${QUOTA_PRO_MONTHLY:500}
    upgrade-url: ${UPGRADE_URL:https://factur-x-api.com/tarifs}
  keys:
    ip-limit-per-hour: ${KEYS_IP_LIMIT_PER_HOUR:5}
  lemonsqueezy:
    # 空则 webhook 端点 503 fail closed（订阅永不生效——上线检查项！）
    webhook-secret: ${LS_WEBHOOK_SECRET:}
