spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  lemonsqueezy:
    webhook-secret: test-webhook-secret
  creem:
    webhook-secret: test-creem-secret
    # checkout 默认未配置（503）；需要成功的用例用 @SpringBootTest properties 覆盖
    api-base: http://localhost:9/v1
    api-key:
    product-id:
  resend:
    # 默认未配置：欢迎邮件静默跳过，测试不会出网
    api-base: http://localhost:9
    api-key:
    from: Factur-X API <test@example.com>
